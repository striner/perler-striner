[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "python-backend"
version = "0.1.0"
description = "GPU-ready processing service framework for Perler Striner"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bentoml>=1.4.33,<2",
    "fastapi>=0.116,<1",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_backend"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
